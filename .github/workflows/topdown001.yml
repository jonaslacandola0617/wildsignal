name: TOPDOWN-001 synthetic-only playable validation
on:
  push:
    branches: [feat/topdown-001-playable-lantern-quay]
  pull_request:
    branches: [feat/topdown-001-pixelcrawler-sdl-proof]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install Pillow
      - run: cmake -S experiments/topdown001 -B build/topdown -G "Visual Studio 17 2022" -A x64 -T v143 -DTOPDOWN001_BUILD_LEGACY=OFF
      - run: cmake --build build/topdown --config Release --parallel 2
      - run: ctest --test-dir build/topdown -C Release --output-on-failure
      - run: python experiments/topdown001/tests/import_test.py experiments/topdown001
      - name: Stage code-only runtime (no licensed art or captures)
        run: cmake --install build/topdown --config Release --prefix out/topdown001-windows-x64
      - name: Artifact checksums
        shell: pwsh
        run: |
          $root = (Resolve-Path out/topdown001-windows-x64).Path
          $files = @(Get-ChildItem $root -Recurse -File | Where-Object Name -ne SHA256SUMS.txt)
          $sums = @($files | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetRelativePath($root, $_.FullName))"
          })
          [IO.File]::WriteAllLines((Join-Path $root SHA256SUMS.txt), $sums)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: topdown001-windows-x64-code-only
          path: out/topdown001-windows-x64
          retention-days: 14
  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m pip install Pillow
      - run: cmake -S experiments/topdown001 -B build/topdown-asan -DCMAKE_BUILD_TYPE=Debug -DTOPDOWN001_BUILD_SDL=OFF -DTOPDOWN001_SANITIZE=ON
      - run: cmake --build build/topdown-asan --parallel 2
      - run: ctest --test-dir build/topdown-asan --output-on-failure
      - run: python3 experiments/topdown001/tests/import_test.py experiments/topdown001
