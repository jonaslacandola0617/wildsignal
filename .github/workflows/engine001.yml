name: ENGINE-001 native proof
on:
  push:
    branches: [feat/engine-001-echo-renderer]
  pull_request:
    branches: [docs/world-preproduction-v0.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Windows x64 Release (VS 2022 v143, static SDL3 and CRT)
        run: cmake -S . -B build/win -G "Visual Studio 17 2022" -A x64 -T v143
      - run: cmake --build build/win --config Release --parallel 2
      - run: ctest --test-dir build/win -C Release --output-on-failure
      - name: Record toolchain and imports (legacy compatibility remains unverified)
        shell: pwsh
        run: |
          cmake --version | Out-File build/win/toolchain.txt
          Get-Content build/win/CMakeCache.txt | Select-String 'CMAKE_CXX_COMPILER|CMAKE_CXX_COMPILER_VERSION|SDL_' | Out-File build/win/toolchain.txt -Append
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName | Select-Object -Last 1
          & $dumpbin.FullName /headers /imports build/win/Release/wildsignal_engine001.exe | Out-File build/win/imports.txt
      - name: Stage portable prototype
        run: cmake --install build/win --config Release --prefix out/engine001-windows-x64
      - name: Artifact checksums
        shell: pwsh
        run: |
          $packageRoot = (Resolve-Path out/engine001-windows-x64).Path
          $packageFiles = @(Get-ChildItem $packageRoot -Recurse -File | Where-Object Name -ne SHA256SUMS.txt)
          $checksums = @($packageFiles | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath($packageRoot, $_.FullName)
            "$digest  $relative"
          })
          [IO.File]::WriteAllLines((Join-Path $packageRoot SHA256SUMS.txt), $checksums)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine001-windows-x64
          path: |
            out/engine001-windows-x64
            build/win/toolchain.txt
            build/win/imports.txt
            build/win/bench/local
          retention-days: 14
  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug -DENGINE001_BUILD_SDL=OFF -DENGINE001_SANITIZE=ON
      - run: cmake --build build/asan --parallel 2
      - run: ctest --test-dir build/asan --output-on-failure
