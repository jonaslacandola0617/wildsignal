name: 2P5D-001 synthetic-only hybrid validation
on:
  push:
    branches: [feat/2p5d-001-hybrid-world]
  pull_request:
    branches: [feat/topdown-001-playable-lantern-quay]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install Pillow
      - run: cmake -S experiments/2p5d001 -B build/hybrid -G "Visual Studio 17 2022" -A x64 -T v143
      - run: cmake --build build/hybrid --config Release --parallel 2
      - run: ctest --test-dir build/hybrid -C Release --output-on-failure
      - run: python experiments/topdown001/tests/import_test.py experiments/topdown001
      - name: Stage code-only runtime; no licensed pixels
        run: cmake --install build/hybrid --config Release --prefix out/hybrid001-windows-x64
      - name: Artifact checksums
        shell: pwsh
        run: |
          $root = (Resolve-Path out/hybrid001-windows-x64).Path
          $files = @(Get-ChildItem $root -Recurse -File | Where-Object Name -ne SHA256SUMS.txt)
          $sums = @($files | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetRelativePath($root, $_.FullName))"
          })
          [IO.File]::WriteAllLines((Join-Path $root SHA256SUMS.txt), $sums)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hybrid001-windows-x64-code-only
          path: out/hybrid001-windows-x64
          retention-days: 14
  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m pip install Pillow
      - run: cmake -S experiments/2p5d001 -B build/hybrid-asan -DCMAKE_BUILD_TYPE=Debug -DHYBRID_BUILD_SDL=OFF -DHYBRID_SANITIZE=ON
      - run: cmake --build build/hybrid-asan --parallel 2
      - run: ctest --test-dir build/hybrid-asan --output-on-failure
      - run: python3 experiments/topdown001/tests/import_test.py experiments/topdown001
      - name: Preserved first-person regression
        run: |
          cmake -S . -B build/first-person -DCMAKE_BUILD_TYPE=Release -DENGINE001_BUILD_SDL=OFF
          cmake --build build/first-person --parallel 2
          ctest --test-dir build/first-person --output-on-failure
